<svg width="100%" height="100%" viewBox="0 0 860 1085" overflow="visible" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<defs>
  <!-- Ambient Blur Filter (Expanded bounds to prevent any clipping) -->
  <filter id="ambientBlur" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="75" />
  </filter>

  <!-- Expanded Shadow Filters to permanently fix sharp cutoff lines -->
  <filter id="glassShadow" x="-200%" y="-200%" width="500%" height="500%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.04" />
  </filter>

  <!-- Clean Neutral Badge Shadow (Infinitely wide bounds) -->
  <filter id="neutralShadow" x="-200%" y="-200%" width="500%" height="500%">
    <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.1" />
  </filter>

  <!-- Button Drop Shadow -->
  <filter id="buttonShadow" x="-200%" y="-200%" width="500%" height="500%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04" />
  </filter>

  <!-- Animated Shimmering Ribbon Gradients -->
  <linearGradient id="ribbonFrontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#2563eb">
      <animate attributeName="stop-color" values="#2563eb;#60a5fa;#1d4ed8;#2563eb" dur="7s" repeatCount="indefinite" />
    </stop>
    <stop offset="45%" stop-color="#3b82f6">
      <animate attributeName="stop-color" values="#3b82f6;#93c5fd;#2563eb;#3b82f6" dur="7s" repeatCount="indefinite" />
    </stop>
    <stop offset="80%" stop-color="#1d4ed8">
      <animate attributeName="stop-color" values="#1d4ed8;#3b82f6;#1e40af;#1d4ed8" dur="7s" repeatCount="indefinite" />
    </stop>
    <stop offset="100%" stop-color="#1e40af" />
  </linearGradient>

  <linearGradient id="ribbonBackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1e40af" />
    <stop offset="50%" stop-color="#1d4ed8" />
    <stop offset="100%" stop-color="#172554" />
  </linearGradient>

  <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ef4444" />
    <stop offset="100%" stop-color="#dc2626" />
  </linearGradient>

  <clipPath id="avatarClip">
    <rect x="0" y="0" width="170" height="170" rx="14" />
  </clipPath>
</defs>

<style>
  .heading-font { font-family: 'Space Grotesk', 'Plus Jakarta Sans', system-ui, sans-serif; }
  .body-font { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  .mono-font { font-family: 'JetBrains Mono', monospace; }

  .glass-card {
    fill: rgba(255, 255, 255, 0.75);
    stroke: rgba(255, 255, 255, 0.9);
    stroke-width: 1.2;
    filter: url(#glassShadow);
  }

  .pill-bg { fill: rgba(255, 255, 255, 0.9); stroke: #e2e8f0; stroke-width: 1; }
  .pill-text { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 11px; fill: #1e293b; }
  .keycap-bg { rx: 10px; ry: 10px; filter: drop-shadow(0px 3px 4px rgba(0,0,0,0.05)); }
  
  .text-slate-900 { fill: #0f172a; }
  .text-slate-700 { fill: #334155; }
  .text-slate-500 { fill: #64748b; }

  /* Smooth Harmonic Pendulum Sway */
  @keyframes lanyardSway {
    0%   { transform: rotate(-2.2deg); }
    50%  { transform: rotate(2.2deg); }
    100% { transform: rotate(-2.2deg); }
  }
  .swinging-assembly {
    transform-origin: 135px -15px;
    animation: lanyardSway 4.8s ease-in-out infinite;
  }

  /* Floating Ambient Glow Animations */
  @keyframes floatGlow1 {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.45; }
    50%      { transform: translate(30px, 25px) scale(1.15); opacity: 0.65; }
  }
  @keyframes floatGlow2 {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.55; }
    50%      { transform: translate(-30px, -20px) scale(1.1); opacity: 0.75; }
  }
  .glow-orb-1 { animation: floatGlow1 11s ease-in-out infinite; }
  .glow-orb-2 { animation: floatGlow2 13s ease-in-out infinite; }

  .footer-btn {
    fill: #ffffff;
    stroke: #e2e8f0;
    stroke-width: 1;
    filter: url(#buttonShadow);
    cursor: pointer;
  }
  .btn-link { text-decoration: none; }
  .btn-link:hover .footer-btn { fill: #f8fafc; stroke: #cbd5e1; }
</style>

<!-- Base Background -->
<rect width="100%" height="100%" fill="#f8fafc" />

<!-- Soft Ambient Glow Orbs (Replaced red orb with clean indigo/blue) -->
<g filter="url(#ambientBlur)">
  <circle cx="680" cy="200" r="140" fill="#e0e7ff" class="glow-orb-1" />
  <circle cx="160" cy="560" r="160" fill="#dbeafe" class="glow-orb-2" />
  <circle cx="700" cy="850" r="150" fill="#e0e7ff" class="glow-orb-1" />
</g>

<!-- ================================================================= -->
<!-- 1. TOP ROW: BEHIND THE CODE (LEFT) + SWINGING ID BADGE (RIGHT)    -->
<!-- ================================================================= -->
<g transform="translate(45, 50)">
  <text x="0" y="24" class="heading-font text-slate-900" font-size="28" font-weight="900" letter-spacing="-0.5">Behind the Code</text>
  <text x="0" y="48" class="body-font text-slate-500" font-size="11.5" font-weight="700" letter-spacing="0.5">{{BEHIND_THE_CODE_SUBHEADING}}</text>
  
  <text x="0" y="86" class="body-font text-slate-700" font-size="13" font-weight="500">
    {{BEHIND_THE_CODE_DESCRIPTION}}
  </text>
</g>

<!-- SWINGING ID BADGE -->
<g transform="translate(560, 15)">
  <g class="swinging-assembly">
    <g id="backStrap">
      <path d="M 121 141 C 144 95 168 40 183 -15 L 209 -15 C 192 40 168 95 149 141 Z" fill="url(#ribbonBackGrad)"/>
      <path d="M 135 141 C 156 95 180 40 196 -15" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 3" opacity="0.25" fill="none"/>
    </g>

    <g filter="url(#neutralShadow)">
      <rect x="15" y="125" width="240" height="315" rx="22" fill="url(#badgeGrad)" stroke="#f87171" stroke-width="1.5"/>
      <rect x="108" y="136" width="54" height="11" rx="5.5" fill="#0f172a" opacity="0.8"/>
      
      <circle cx="38" cy="164" r="11" fill="#ffffff" fill-opacity="0.2"/>
      <path d="M 34 164 L 37 161 M 34 164 L 37 167 M 42 164 L 39 161 M 42 164 L 39 167" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="232" y="167" fill="#fee2e2" font-size="9" font-weight="800" text-anchor="end" class="heading-font" letter-spacing="1">WEB DEV</text>

      <g transform="translate(50, 185)">
        <rect x="-3" y="-3" width="176" height="176" rx="16" fill="#ffffff"/>
        <g clip-path="url(#avatarClip)">
          <image x="0" y="0" width="170" height="170" preserveAspectRatio="xMidYMid slice" href="{{AVATAR_DATA_URI}}" />
        </g>
      </g>

      <text x="35" y="394" fill="#ffffff" font-size="15" font-weight="900" class="heading-font" letter-spacing="-0.3">{{NAME}}</text>
      <text x="35" y="410" fill="#fee2e2" font-size="9" font-weight="700" class="mono-font" letter-spacing="0.5">ID: DEV-{{USERNAME}}</text>

      <a href="https://github.com/{{USERNAME}}" target="_blank">
        <g transform="translate(202, 380)">
          <rect width="32" height="32" rx="8" fill="#ffffff" stroke="#fecaca" stroke-width="0.8"/>
          <image href="{{ICON_GITHUB_RED}}" x="4" y="4" width="24" height="24" preserveAspectRatio="xMidYMid meet"/>
        </g>
      </a>
    </g>

    <g id="frontStrap">
      <path d="M 119 125 L 121 141 L 149 141 L 146 125 Z" fill="#000000" opacity="0.25"/>
      <path d="M 61 -15 C 78 40 100 95 121 141 L 149 141 C 124 95 100 40 87 -15 Z" fill="url(#ribbonFrontGrad)"/>
      <path d="M 74 -15 C 89 40 111 95 135 141" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3.5 3.5" opacity="0.45" fill="none"/>
      <line x1="121" y1="141" x2="149" y2="141" stroke="#0f172a" stroke-width="1.8" opacity="0.6"/>
    </g>
  </g>
</g>

<!-- ================================================================= -->
<!-- 2. FULL WIDTH CONTRIBUTION GRID WITH ARCADE SNAKE                 -->
<!-- ================================================================= -->
<g transform="translate(45, 475)">
  <rect width="770" height="152" rx="20" class="glass-card"/>
  
  <g transform="translate(15.5, 18)">
    <text x="0" y="10" class="heading-font text-slate-900" font-size="12" font-weight="800" letter-spacing="0.5">CONTRIBUTION GRAPH &amp; COMMIT ACTIVITY (LAST 365 DAYS)</text>
    <g transform="translate(0, 22)">
      {{CONTRIBUTION_SNAKE_SECTION}}
    </g>
  </g>
</g>

<!-- ================================================================= -->
<!-- 3. EDUCATION & STATS + SKILLS & TECH KEYCAPS                      -->
<!-- ================================================================= -->
<g transform="translate(45, 650)">
  <rect width="365" height="292" rx="20" class="glass-card"/>

  <g transform="translate(24, 20)">
    <text x="0" y="16" class="heading-font text-slate-900" font-size="18" font-weight="900">Education</text>
    {{EDUCATION_ITEMS}}
  </g>

  <g transform="translate(24, 160)">
    <image href="{{ICON_GITHUB}}" x="0" y="0" width="16" height="16"/>
    <text x="24" y="13" class="heading-font text-slate-900" font-size="12" font-weight="800" letter-spacing="0.4">GITHUB LIVE OVERVIEW (ALL-TIME)</text>

    <g transform="translate(0, 26)">
      <rect x="0" y="0" width="74" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
      <text x="37" y="24" text-anchor="middle" class="body-font text-slate-900" font-size="14" font-weight="900">{{COMMITS}}</text>
      <text x="37" y="40" text-anchor="middle" class="body-font text-slate-500" font-size="8.5" font-weight="700">COMMITS</text>

      <rect x="81" y="0" width="74" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
      <text x="118" y="24" text-anchor="middle" class="body-font text-slate-900" font-size="14" font-weight="900">{{REPOS}}</text>
      <text x="118" y="40" text-anchor="middle" class="body-font text-slate-500" font-size="8.5" font-weight="700">REPOS</text>

      <rect x="162" y="0" width="74" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
      <text x="199" y="24" text-anchor="middle" class="body-font text-slate-900" font-size="13" font-weight="900">{{ACTIVE_DAYS}}</text>
      <text x="199" y="40" text-anchor="middle" class="body-font text-slate-500" font-size="8.5" font-weight="700">ACTIVE D</text>

      <rect x="243" y="0" width="74" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
      <text x="280" y="24" text-anchor="middle" class="body-font text-slate-900" font-size="14" font-weight="900">{{STARS}}</text>
      <text x="280" y="40" text-anchor="middle" class="body-font text-slate-500" font-size="8.5" font-weight="700">STARS</text>
    </g>
  </g>
</g>

<!-- RIGHT GLASS CONTAINER: SKILLS & KEYCAPS -->
<g transform="translate(430, 650)">
  <rect width="385" height="292" rx="20" class="glass-card"/>

  <g transform="translate(24, 20)">
    <text x="0" y="16" class="heading-font text-slate-900" font-size="18" font-weight="900">Skills</text>
    <g transform="translate(0, 28)">
      {{SKILLS_ITEMS}}
    </g>
  </g>

  <g transform="translate(24, 160)">
    <text x="0" y="14" class="heading-font text-slate-900" font-size="12" font-weight="800" letter-spacing="0.4">TECH STACK</text>
    <g transform="translate(0, 24)">
      {{TECH_STACK_ITEMS}}
    </g>
  </g>
</g>

<!-- ================================================================= -->
<!-- 4. BOTTOM: LET'S CONNECT BUTTON PILLS                             -->
<!-- ================================================================= -->
<g transform="translate(45, 965)">
  <rect width="770" height="68" rx="20" class="glass-card"/>

  <a href="https://instagram.com/{{INSTAGRAM_HANDLE}}" target="_blank" class="btn-link">
    <g transform="translate(18, 12)">
      <rect width="232" height="44" rx="14" class="footer-btn"/>
      <image href="{{ICON_INSTAGRAM}}" x="14" y="11" width="22" height="22"/>
      <text x="44" y="27" class="body-font text-slate-800" font-size="12" font-weight="700">@{{INSTAGRAM_HANDLE}}</text>
    </g>
  </a>

  <a href="mailto:{{EMAIL}}" target="_blank" class="btn-link">
    <g transform="translate(268, 12)">
      <rect width="232" height="44" rx="14" class="footer-btn"/>
      <image href="{{ICON_EMAIL}}" x="14" y="11" width="22" height="22"/>
      <text x="44" y="27" class="body-font text-slate-800" font-size="12" font-weight="700">{{EMAIL}}</text>
    </g>
  </a>

  <a href="https://github.com/{{USERNAME}}" target="_blank" class="btn-link">
    <g transform="translate(518, 12)">
      <rect width="234" height="44" rx="14" class="footer-btn"/>
      <image href="{{ICON_GITHUB}}" x="14" y="11" width="22" height="22"/>
      <text x="44" y="27" class="body-font text-slate-800" font-size="12" font-weight="700">github.com/{{USERNAME}}</text>
    </g>
  </a>
</g>

</svg>
