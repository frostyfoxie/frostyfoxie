<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="6200" viewBox="0 0 1400 6200">
    <!-- Gradients -->
    <linearGradient id="lanyardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2563eb" />
        <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="redBadgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ef4444" />
        <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="pythonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2563eb" />
        <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
</defs>

<!-- STREAMING_CHUNK:Rendering background poster frame... -->
<!-- Main Poster Frame -->
<rect x="50" y="50" width="900" height="1320" rx="36" class="card-bg" stroke="#e2e8f0" stroke-width="1" />

<!-- ==================== TOP HEADER SECTION ==================== -->
<!-- STREAMING_CHUNK:Rendering header and description... -->
<g transform="translate(90, 95)">
    <!-- Behind the Visuals / Behind the Code Title -->
    <text x="0" y="32" class="heading" font-size="30">Behind the Code</text>
    
    <!-- Description paragraphs -->
    <text x="0" y="75" class="body-text" width="480">
        <tspan x="0" dy="0">I'm a passionate Web Developer specializing in building high-performance</tspan>
        <tspan x="0" dy="20">full-stack web applications and intuitive digital experiences. Through diverse</tspan>
        <tspan x="0" dy="20">open-source and client projects, I strive to write clean, scalable code and</tspan>
        <tspan x="0" dy="20">continuously adopt modern web technologies.</tspan>
        <tspan x="0" dy="30">My strengths lie in rapid prototyping, clean architecture, responsive design,</tspan>
        <tspan x="0" dy="20">and solving complex technical challenges efficiently.</tspan>
    </text>
</g>

<!-- ==================== ID CARD & LANYARD (RIGHT SIDE) ==================== -->
<!-- STREAMING_CHUNK:Rendering ID card and lanyard graphic... -->
<g transform="translate(620, 45)">
    <!-- Lanyard Ribbon Straps -->
    <path d="M 50 0 C 70 60 120 100 145 132" stroke="url(#lanyardGrad)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M 50 0 C 70 60 120 100 145 132" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="4 4" fill="none" opacity="0.45"/>
    
    <path d="M 230 0 C 210 60 160 100 135 132" stroke="url(#lanyardGrad)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M 230 0 C 210 60 160 100 135 132" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="4 4" fill="none" opacity="0.45"/>

    <!-- Metal Buckle Mechanism -->
    <rect x="131" y="126" width="18" height="16" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/>
    <rect x="135" y="130" width="10" height="4" fill="#1e293b"/>
    <path d="M 140 142 L 140 156 A 3 3 0 0 0 143 156 L 143 142 Z" fill="#94a3b8" stroke="#334155" stroke-width="1"/>

    <!-- ID Badge Card Container (Rotated slightly) -->
    <g transform="translate(15, 150) rotate(-3)">
        <rect x="0" y="0" width="240" height="310" rx="24" fill="url(#redBadgeGrad)" stroke="#fca5a5" stroke-width="2" filter="drop-shadow(0 15px 30px rgba(220,38,38,0.3))"/>
        
        <!-- Top Slot Cutout -->
        <rect x="100" y="10" width="40" height="8" rx="4" fill="#0f172a" opacity="0.6"/>

        <!-- Badge Header -->
        <g transform="translate(18, 28)">
            <circle cx="12" cy="12" r="12" fill="#ffffff" fill-opacity="0.2"/>
            <text x="12" y="16" font-size="11" fill="#ffffff" text-anchor="middle">&#128187;</text>
            <text x="210" y="15" font-size="9" font-weight="900" fill="#fee2e2" letter-spacing="1.5" text-anchor="end">WEB DEV</text>
        </g>

        <!-- ID Photo Container with Image Path -->
        <g transform="translate(18, 56)">
            <rect x="0" y="0" width="204" height="190" rx="16" fill="#ffe4e6" stroke="#ffffff" stroke-width="3"/>
            <!-- Replace 'path/to/your-image.jpg' with your actual image path -->
            <image href="path/to/your-image.jpg" x="0" y="0" width="204" height="190" preserveAspectRatio="xMidYMid slice" clip-path="inset(0 round 16px)" />
        </g>

        <!-- Badge Footer Details -->
        <g transform="translate(18, 264)">
            <text x="0" y="0" class="heading" font-size="14" fill="#ffffff">ALEX MORGAN</text>
            <text x="0" y="15" class="mono" font-size="9" font-weight="700" fill="#fee2e2" letter-spacing="1">ID: DEV-2025-SF</text>
            
            <!-- QR Code Box -->
            <g transform="translate(168, -16)" fill="#0f172a">
                <rect x="0" y="0" width="36" height="36" rx="6" fill="#ffffff"/>
                <rect x="4" y="4" width="12" height="12" fill="#0f172a"/>
                <rect x="20" y="4" width="12" height="12" fill="#0f172a"/>
                <rect x="4" y="20" width="12" height="12" fill="#0f172a"/>
                <rect x="20" y="20" width="4" height="4" fill="#0f172a"/>
                <rect x="28" y="20" width="4" height="12" fill="#0f172a"/>
            </g>
        </g>
    </g>
</g>

<!-- Horizontal Divider Line -->
<line x1="90" y1="410" x2="910" y2="410" stroke="#cbd5e1" stroke-width="1" opacity="0.8"/>

