<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="6200" viewBox="0 0 1400 6200">
  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#173b42" opacity=".18"/>
    </pattern>
    <pattern id="smallDots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#173b42" opacity=".16"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-opacity=".14"/>
    </filter>
    <style>
      .title{font-family:Arial,Helvetica,sans-serif;font-weight:900;letter-spacing:2px}
      .heading{font-family:Arial,Helvetica,sans-serif;font-weight:900;letter-spacing:1px}
      .body{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#173b42}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#173b42}
      .mono{font-family:monospace;font-size:19px;fill:#173b42}
      .label{font-family:Arial,Helvetica,sans-serif;font-weight:800;font-size:17px;letter-spacing:2px}
      .outline{stroke:#173b42;stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
      .thin{stroke:#173b42;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    </style>
  </defs>

  <!-- paper -->
  <rect width="1400" height="6200" fill="#f5f0df"/>
  <rect width="1400" height="6200" fill="url(#smallDots)" opacity=".45"/>

  <!-- HEADER -->
  <rect x="45" y="45" width="1310" height="570" rx="28" fill="#168d91" class="outline"/>
  <rect x="70" y="70" width="1260" height="520" rx="20" fill="url(#dots)" opacity=".75"/>

  <text x="85" y="175" class="title" font-size="100" fill="#f5f0df">BEHIND</text>
  <text x="85" y="275" class="title" font-size="100" fill="#f5f0df">THE BUILDER</text>

  <text x="90" y="330" class="label" fill="#173b42">ARYAN // FROSTYFOXIE</text>
  <text x="90" y="372" class="small" fill="#f5f0df">STUDENT · SOFTWARE BUILDER · AI &amp; EMERGING TECHNOLOGY</text>

  <!-- intro speech bubble -->
  <path d="M90 425 Q90 390 125 390 H770 Q805 390 805 425 V495 Q805 530 770 530 H190 L130 565 L150 530 H125 Q90 530 90 495Z"
        fill="#f5f0df" class="outline"/>
  <text x="125" y="450" class="body" font-weight="700">I build software at the intersection of</text>
  <text x="125" y="485" class="body" font-weight="700">AI, education, science and interactive technology.</text>

  <!-- simple original builder illustration -->
  <g transform="translate(1000 315)">
    <ellipse cx="0" cy="185" rx="215" ry="38" fill="#173b42" opacity=".18"/>
    <rect x="-160" y="55" width="280" height="150" rx="18" fill="#f5f0df" class="outline"/>
    <rect x="-135" y="78" width="230" height="100" rx="8" fill="#b8dfe0" class="thin"/>
    <path d="M-105 110h85M-105 135h135M-105 160h70" class="thin" fill="none"/>
    <circle cx="-20" cy="-35" r="82" fill="#e7c3a1" class="outline"/>
    <path d="M-100-55 Q-65-125 5-110 Q75-100 90-35 Q50-62 20-45 Q-15-70-100-55Z" fill="#173b42" class="outline"/>
    <circle cx="-35" cy="-30" r="8" fill="#173b42"/>
    <circle cx="35" cy="-30" r="8" fill="#173b42"/>
    <path d="M-35 12 Q0 35 35 12" fill="none" class="thin"/>
    <path d="M-120 45 Q-170 100-135 185 M120 45 Q170 100 135 185" fill="none" class="outline"/>
    <path d="M-70 190 L-85 300 M70 190 L90 300" fill="none" class="outline"/>
    <path d="M-85 300h-70 M90 300h70" fill="none" class="outline"/>
  </g>

  <!-- SECTION 01 -->
  <g transform="translate(60 690)">
    <text x="0" y="55" class="heading" font-size="58" fill="#168d91">01 / ABOUT</text>
    <path d="M0 82 H1280" class="thin" fill="none"/>
    <rect x="0" y="115" width="1280" height="330" rx="24" fill="#fffdf2" class="outline" filter="url(#shadow)"/>
    <text x="40" y="170" class="label" fill="#168d91">WHO I AM</text>
    <text x="40" y="215" class="body">Student and software builder interested in ambitious, experimental software.</text>
    <text x="40" y="255" class="body">I explore ideas by turning them into working systems, interfaces and experiences.</text>
    <text x="40" y="315" class="label" fill="#168d91">INTERSECTION</text>
    <text x="40" y="355" class="body" font-weight="700">Artificial Intelligence · Education · Science · Interactive Technology</text>
    <text x="40" y="400" class="small">CURIOUS BY DEFAULT · BUILDING TO LEARN · LEARNING BY BUILDING</text>
    <circle cx="1110" cy="275" r="105" fill="#f2c94c" class="outline"/>
    <path d="M1060 275h100M1110 225v100" class="thin"/>
    <circle cx="1110" cy="275" r="40" fill="#168d91" class="outline"/>
  </g>

  <!-- SECTION 02 -->
  <g transform="translate(60 1190)">
    <text x="0" y="55" class="heading" font-size="58" fill="#168d91">02 / WHAT I WORK WITH</text>
    <path d="M0 82 H1280" class="thin" fill="none"/>

    <g transform="translate(0 115)">
      <rect x="0" y="0" width="395" height="255" rx="22" fill="#dceeee" class="outline"/>
      <text x="30" y="52" class="heading" font-size="31">LANGUAGES</text>
      <text x="30" y="95" class="body">Python</text><text x="190" y="95" class="body">TypeScript</text>
      <text x="30" y="135" class="body">JavaScript</text><text x="190" y="135" class="body">SQL</text>
      <text x="30" y="175" class="body">HTML</text><text x="190" y="175" class="body">CSS</text>
      <text x="30" y="220" class="small">PRIMARY PROGRAMMING TOOLKIT</text>

      <rect x="442" y="0" width="395" height="255" rx="22" fill="#f2c94c" class="outline"/>
      <text x="472" y="52" class="heading" font-size="31">AI / SYSTEMS</text>
      <text x="472" y="95" class="body">LLMs · AI Agents</text>
      <text x="472" y="135" class="body">Multimodal AI</text>
      <text x="472" y="175" class="body">Tool Calling</text>
      <text x="472" y="215" class="body">Semantic Search</text>

      <rect x="884" y="0" width="396" height="255" rx="22" fill="#e9d9d0" class="outline"/>
      <text x="914" y="52" class="heading" font-size="31">WEB / INFRA</text>
      <text x="914" y="95" class="body">React · Vite</text>
      <text x="914" y="135" class="body">Tailwind · APIs</text>
      <text x="914" y="175" class="body">PostgreSQL · Supabase</text>
      <text x="914" y="215" class="body">Vercel · GitHub Actions</text>
    </g>
  </g>

  <!-- SECTION 03 -->
  <g transform="translate(60 1650)">
    <text x="0" y="55" class="heading" font-size="58" fill="#168d91">03 / TECHNICAL INTERESTS</text>
    <path d="M0 82 H1280" class="thin" fill="none"/>
    <rect x="0" y="115" width="1280" height="470" rx="24" fill="#fffdf2" class="outline"/>

    <g transform="translate(45 155)">
      <text x="0" y="0" class="label" fill="#168d91">ARTIFICIAL INTELLIGENCE</text>
      <text x="0" y="38" class="body">AI agents · autonomous systems · multimodal AI · conversational AI</text>

      <text x="0" y="105" class="label" fill="#168d91">EDUCATION TECHNOLOGY</text>
      <text x="0" y="143" class="body">adaptive learning · assessment · learning analytics · JEE technology</text>

      <text x="0" y="210" class="label" fill="#168d91">SCIENCE &amp; SIMULATION</text>
      <text x="0" y="248" class="body">physics · astronomy · cosmology · scientific visualisation</text>

      <text x="0" y="315" class="label" fill="#168d91">INTERACTION</text>
      <text x="0" y="353" class="body">creative coding · interactive experiences · human–computer interaction</text>
    </g>

    <g transform="translate(1010 175)">
      <circle cx="0" cy="0" r="90" fill="#168d91" class="outline"/>
      <circle cx="0" cy="0" r="48" fill="#f5f0df" class="outline"/>
      <path d="M-145 150 Q-60 90 0 150 Q60 210 145 150" fill="none" class="thin"/>
      <text x="-78" y="6" class="heading" font-size="18" fill="#173b42">EXPLORE</text>
    </g>
  </g>

  <!-- SECTION 04 GITHUB -->
  <g transform="translate(60 2300)">
    <text x="0" y="55" class="heading" font-size="58" fill="#168d91">04 / GITHUB</text>
    <path d="M0 82 H1280" class="thin" fill="none"/>

    <rect x="0" y="115" width="1280" height="510" rx="24" fill="#173b42" class="outline"/>
    <text x="40" y="170" class="label" fill="#f2c94c">LIVE PROFILE DATA</text>

    <g transform="translate(40 205)">
      <g>
        <rect width="275" height="130" rx="16" fill="#f5f0df" class="thin"/>
        <text x="25" y="42" class="label">COMMITS</text>
        <text x="25" y="92" class="title" font-size="44" fill="#168d91">{{TOTAL_COMMITS}}</text>
      </g>
      <g transform="translate(305 0)">
        <rect width="275" height="130" rx="16" fill="#f5f0df" class="thin"/>
        <text x="25" y="42" class="label">STARS</text>
        <text x="25" y="92" class="title" font-size="44" fill="#168d91">{{TOTAL_STARS}}</text>
      </g>
      <g transform="translate(610 0)">
        <rect width="275" height="130" rx="16" fill="#f5f0df" class="thin"/>
        <text x="25" y="42" class="label">REPOSITORIES</text>
        <text x="25" y="92" class="title" font-size="44" fill="#168d91">{{TOTAL_REPOSITORIES}}</text>
      </g>
      <g transform="translate(915 0)">
        <rect width="275" height="130" rx="16" fill="#f5f0df" class="thin"/>
        <text x="25" y="42" class="label">FOLLOWERS</text>
        <text x="25" y="92" class="title" font-size="44" fill="#168d91">{{FOLLOWERS}}</text>
      </g>

      <text x="0" y="190" class="label" fill="#f2c94c">REPOSITORY BREAKDOWN</text>
      <text x="0" y="232" class="body" fill="#f5f0df">PUBLIC</text>
      <text x="135" y="232" class="title" font-size="28" fill="#f5f0df">{{PUBLIC_REPOSITORIES}}</text>
      <text x="300" y="232" class="body" fill="#f5f0df">PRIVATE</text>
      <text x="440" y="232" class="title" font-size="28" fill="#f5f0df">{{PRIVATE_REPOSITORIES}}</text>
      <text x="620" y="232" class="body" fill="#f5f0df">FORKS</text>
      <text x="735" y="232" class="title" font-size="28" fill="#f5f0df">{{TOTAL_FORKS}}</text>

      <text x="0" y="300" class="label" fill="#f2c94c">MOST USED LANGUAGES</text>
      <text x="0" y="340" class="body" fill="#f5f0df">{{TOP_LANGUAGE_1}}</text>
      <text x="0" y="375" class="body" fill="#f5f0df">{{TOP_LANGUAGE_2}}</text>
      <text x="0" y="410" class="body" fill="#f5f0df">{{TOP_LANGUAGE_3}}</text>

      <text x="600" y="300" class="label" fill="#f2c94c">ACTIVITY</text>
      <text x="600" y="340" class="body" fill="#f5f0df">First activity: {{FIRST_COMMIT_DATE}}</text>
      <text x="600" y="375" class="body" fill="#f5f0df">Latest activity: {{LATEST_COMMIT_DATE}}</text>
      <text x="600" y="410" class="body" fill="#f5f0df">Most active: {{MOST_ACTIVE_PERIOD}}</text>
    </g>
  </g>

  <!-- SECTION 05 -->
  <g transform="translate(60 2990)">
    <text x="0" y="55" class="heading" font-size="58" fill="#168d91">05 / GITHUB ACTIVITY</text>
    <path d="M0 82 H1280" class="thin" fill="none"/>
    <rect x="0" y="115" width="1280" height="390" rx="24" fill="#fffdf2" class="outline"/>
    <text x="40" y="165" class="label">CONTRIBUTION HISTORY</text>

    <!-- contribution placeholder grid -->
    <g transform="translate(45 205)">
      <rect x="0" y="0" width="1190" height="205" rx="12" fill="#dceeee" class="thin"/>
      <text x="25" y="38" class="small">{{CONTRIBUTION_GRAPH}}</text>
      <g opacity=".7">
        <rect x="25" y="70" width="18" height="18" fill="#168d91"/>
        <rect x="50" y="70" width="18" height="18" fill="#168d91" opacity=".75"/>
        <rect x="75" y="70" width="18" height="18" fill="#168d91" opacity=".45"/>
        <rect x="100" y="70" width="18" height="18" fill="#168d91" opacity=".25"/>
      </g>
      <text x="25" y="145" class="small">Replace this region with generated contribution/activity data.</text>
    </g>
  </g>

  <!-- SECTION 06 -->
  <g transform="translate(60 3540)">
    <text x="0" y="55" class="heading" font-size="58" fill="#168d91">06 / CURRENT FOCUS</text>
    <path d="M0 82 H1280" class="thin" fill="none"/>
    <rect x="0" y="115" width="1280" height="340" rx="24" fill="#f2c94c" class="outline"/>
    <text x="45" y="175" class="label">CURRENTLY EXPLORING</text>
    <text x="45" y="225" class="body" font-weight="700">AI agents and autonomous software systems</text>
    <text x="45" y="265" class="body">Adaptive education and multimodal learning systems</text>
    <text x="45" y="305" class="body">Scientific visualisation and interactive experiences</text>
    <text x="45" y="345" class="body">Human–AI interaction and experimental interfaces</text>
    <text x="45" y="400" class="small">SUBJECT TO CHANGE — CURIOSITY HAS A HABIT OF REWRITING THE ROADMAP.</text>
  </g>

  <!-- SECTION 07 -->
  <g transform="translate(60 4020)">
    <text x="0" y="55" class="heading" font-size="58" fill="#168d91">07 / OTHER INTERESTS</text>
    <path d="M0 82 H1280" class="thin" fill="none"/>
    <rect x="0" y="115" width="1280" height="310" rx="24" fill="#fffdf2" class="outline"/>
    <text x="45" y="170" class="body">Creative coding</text>
    <text x="360" y="170" class="body">Interactive storytelling</text>
    <text x="760" y="170" class="body">Physics-based interaction</text>
    <text x="45" y="225" class="body">Animation</text>
    <text x="360" y="225" class="body">Scientific computing</text>
    <text x="760" y="225" class="body">Developer tooling</text>
    <text x="45" y="280" class="body">Data-driven applications</text>
    <text x="360" y="280" class="body">Automation</text>
    <text x="760" y="280" class="body">Human–computer interaction</text>
    <path d="M45 350 Q200 300 355 350 T665 350 T975 350 T1250 350" fill="none" class="thin"/>
  </g>

  <!-- SECTION 08 -->
  <g transform="translate(60 4470)">
    <text x="0" y="55" class="heading" font-size="58" fill="#168d91">08 / PROFILE</text>
    <path d="M0 82 H1280" class="thin" fill="none"/>
    <rect x="0" y="115" width="1280" height="330" rx="24" fill="#168d91" class="outline"/>
    <text x="45" y="175" class="label" fill="#f2c94c">GITHUB</text>
    <text x="45" y="220" class="title" font-size="40" fill="#f5f0df">github.com/frostyfoxie</text>
    <text x="45" y="280" class="label" fill="#f2c94c">IDENTITY</text>
    <text x="45" y="320" class="body" fill="#f5f0df">Aryan · Student · Software Builder</text>
    <text x="45" y="365" class="body" fill="#f5f0df">AI &amp; Emerging Technology</text>
    <text x="800" y="175" class="label" fill="#f2c94c">INSTAGRAM</text>
    <text x="800" y="220" class="title" font-size="32" fill="#f5f0df">@oneinagoogolplex._</text>
    <text x="800" y="285" class="small" fill="#f5f0df">PERSONAL / SOCIAL</text>
  </g>

  <!-- FOOTER -->
  <g transform="translate(60 4970)">
    <rect x="0" y="0" width="1280" height="760" rx="28" fill="#173b42" class="outline"/>
    <text x="55" y="90" class="label" fill="#f2c94c">09 / CONTACT</text>
    <text x="55" y="185" class="title" font-size="92" fill="#f5f0df">KEEP BUILDING.</text>
    <text x="55" y="245" class="body" fill="#f5f0df">GitHub · github.com/frostyfoxie</text>
    <text x="55" y="285" class="body" fill="#f5f0df">Instagram · @oneinagoogolplex._</text>

    <path d="M55 350 H1225" stroke="#f2c94c" stroke-width="5" stroke-dasharray="16 14"/>

    <text x="55" y="415" class="label" fill="#f2c94c">PROFILE</text>
    <text x="55" y="460" class="small" fill="#f5f0df">Student · Software Builder · AI &amp; Emerging Technology</text>
    <text x="55" y="505" class="small" fill="#f5f0df">Artificial Intelligence · Education · Science · Interactive Technology</text>

    <!-- closing illustration -->
    <g transform="translate(1030 470)">
      <circle cx="0" cy="-85" r="68" fill="#e7c3a1" class="outline"/>
      <path d="M-65-95 Q-40-165 30-150 Q75-135 70-80 Q15-110-65-95Z" fill="#168d91" class="outline"/>
      <path d="M-70-20 Q0 15 70-20 L95 130 H-95Z" fill="#f5f0df" class="outline"/>
      <path d="M-35 125v95M35 125v95" class="outline" fill="none"/>
      <path d="M-75 220h-55M75 220h55" class="outline" fill="none"/>
      <path d="M-105 20 Q-180 70-150 145 M105 20 Q180 70 150 145" class="outline" fill="none"/>
    </g>

    <text x="55" y="675" class="small" fill="#f5f0df">FROSTYFOXIE // PORTFOLIO DATA TEMPLATE</text>
    <text x="1020" y="675" class="small" fill="#f5f0df">2026</text>
  </g>

  <!-- tiny editorial marks -->
  <g fill="#168d91" opacity=".7">
    <circle cx="1310" cy="660" r="6"/><circle cx="1280" cy="660" r="6"/><circle cx="1250" cy="660" r="6"/>
    <circle cx="40" cy="6030" r="6"/><circle cx="70" cy="6030" r="6"/><circle cx="100" cy="6030" r="6"/>
