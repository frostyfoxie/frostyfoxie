<svg width="287" height="66" viewBox="0 0 287 66" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="glassShadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.04" />
  </filter>
  <filter id="buttonShadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04" />
  </filter>
</defs>
<style>
  .glass-card {
    fill: rgba(255, 255, 255, 0.75);
    stroke: rgba(255, 255, 255, 0.9);
    stroke-width: 1.2;
    filter: url(#glassShadow);
  }
  .footer-btn {
    fill: #ffffff;
    stroke: #e2e8f0;
    stroke-width: 1;
    filter: url(#buttonShadow);
    transition: all 0.2s ease;
    cursor: pointer;
  }
  svg:hover .footer-btn {
    fill: #f8fafc;
    stroke: #cbd5e1;
  }
  .btn-text {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    font-size: 11.5px;
    font-weight: 700;
    fill: #1e293b;
  }
</style>

<!-- Canvas Base -->
<rect width="100%" height="100%" fill="#f8fafc" />

<!-- Glass Card Container -->
<rect x="6" y="6" width="275" height="54" rx="16" class="glass-card" />

<!-- White Pill Button -->
<rect x="14" y="12" width="259" height="42" rx="13" class="footer-btn" />

<!-- Your Uploaded Icon from icons/ -->
<image href="" x="24" y="22" width="22" height="22" preserveAspectRatio="xMidYMid meet" />

<!-- Label -->
<text x="56" y="38" class="btn-text">@oneinagoogolplex._</text>
</svg>