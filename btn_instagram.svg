<svg width="254" height="76" viewBox="0 0 254 76" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Ambient Blur -->
  <filter id="ambientBlur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="30" />
  </filter>
  <!-- Glass Card Shadow -->
  <filter id="glassShadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.04" />
  </filter>
  <!-- Button Drop Shadow -->
  <filter id="buttonShadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04" />
  </filter>
  <!-- Instagram Gradient -->
  <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#fa7e1e" />
    <stop offset="50%" stop-color="#d62976" />
    <stop offset="100%" stop-color="#962fbf" />
  </linearGradient>
</defs>

<style>
  .glass-card {
    fill: rgba(255, 255, 255, 0.75);
    stroke: rgba(255, 255, 255, 0.9);
    stroke-width: 1.2;
    filter: url(#glassShadow);
  }
  .footer-btn {
    fill: #ffffff;
    stroke: #e2e8f0;
    stroke-width: 1;
    filter: url(#buttonShadow);
    transition: all 0.2s ease;
    cursor: pointer;
  }
  svg:hover .footer-btn {
    fill: #f8fafc;
    stroke: #cbd5e1;
  }
  .btn-text {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    font-size: 11.5px;
    font-weight: 700;
    fill: #1e293b;
  }
</style>

<!-- 1. Seamless Canvas Base Background (Matches Template) -->
<rect width="100%" height="100%" fill="#f8fafc" />

<!-- 2. Ambient Glow (Matches Template) -->
<g filter="url(#ambientBlur)">
  <circle cx="127" cy="38" r="50" fill="#e0e7ff" opacity="0.6" />
</g>

<!-- 3. Frosted Glass Container -->
<rect x="6" y="6" width="242" height="64" rx="18" class="glass-card" />

<!-- 4. Inner White Button Pill -->
<rect x="14" y="16" width="226" height="44" rx="14" class="footer-btn" />

<!-- Instagram Icon -->
<g transform="translate(26, 27)">
  <path fill="url(#igGrad)" d="M11 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
</g>
<text x="56" y="42" class="btn-text">@oneinagoogolplex._</text>
</svg>
