name: Update Profile SVG

on:
#  schedule:
#    - cron: '0 0 * * *' # Daily at midnight UTC
  push:
    branches:
      - main
    paths:
      - 'template.svg'
      - 'config.json'
      - 'icons/**'
      - 'scripts/**'
  workflow_dispatch: # Allows manual run button in Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Dynamic SVG
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          # Uses your PAT token if available (to access private repos/commits), otherwise falls back to GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          INSTAGRAM_HANDLE: ${{ vars.INSTAGRAM_HANDLE || 'your_instagram' }}
        run: |
          python scripts/update_svg.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile.svg btn_instagram.svg btn_email.svg btn_github.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update all-time profile stats" && git push)
