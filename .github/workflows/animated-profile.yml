name: Generate animated profile

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "animation/**"
      - "requirements-animation.txt"
      - ".github/workflows/animated-profile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-animation.txt
      - run: python animation/generate.py
      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/animated-profile.gif
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: regenerate animated profile"
          git push
